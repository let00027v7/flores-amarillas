<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores amarillas 💛</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="scene">

        <!-- Estrellas -->
        <div id="stars"></div>

        <!-- Galaxia de flores -->
        <div id="galaxy"></div>

        <!-- Mensaje central -->
        <div id="center">

            <div class="heart">💛</div>

            <h1>Para ti</h1>

            <p>
                Cada flor amarilla representa un pequeño motivo para sonreír.
                <br><br>
                Espero que esta galaxia te recuerde lo especial que eres.
            </p>

            <small>
                Desliza o arrastra para hacer girar las flores ✨(by adri)
            </small>

        </div>

        <div id="hint">
            Arrastra para girar 🌼
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
